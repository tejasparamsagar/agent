services:
  - type: web
    name: learning-rag-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: AUTH_TOKEN
        sync: false
      - key: PERSIST_DIRECTORY
        value: ./chroma
      - key: UPLOAD_FOLDER
        value: ./uploads
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: chroma-storage
      mountPath: /opt/render/project/src/chroma
      sizeGB: 1
    envVars:
      - key: DEFAULT_DATASET_NAME
        value: htcodehub


